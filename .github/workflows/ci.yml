name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint and format
        run: npm run check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

  registry-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build registry
        run: npm run registry:build

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain public/r public/skills)" ]; then
            echo "::error::Registry artifacts are stale."
            echo "::error::Run 'npm run registry:build' locally and commit the result."
            echo ""
            echo "Changed files:"
            git status --porcelain public/r public/skills
            echo ""
            echo "Diff:"
            git diff public/r public/skills
            exit 1
          fi
          echo "Registry artifacts are in sync with source."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: npm test
